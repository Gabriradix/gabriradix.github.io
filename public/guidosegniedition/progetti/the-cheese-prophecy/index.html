        transition: color 0.3s;
        padding: 15px;
        margin: -15px;

      .home-link:hover {

      }

        position: relative;
        z-index: 1;

        padding: 12rem 0 2rem;

        background: linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold),
          var(--gold-amber)

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 0.5rem;
      }
      header .subtitle {
        font-size: 0.95rem;
        color: var(--text-dim);
        margin-top: 0.5rem;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .actions {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 60px;
        margin: 2rem 0;
        gap: 1rem;
        flex-wrap: wrap;
      }
      #generate-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 1rem 2.5rem;
        font-family: "Outfit", sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--bg);
        background: linear-gradient(135deg, var(--gold), var(--gold-amber));
        border: none;
        border-radius: 50px;
        cursor: pointer;
        overflow: hidden;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s;
        box-shadow: 0 4px 25px rgba(245, 200, 66, 0.25);
      }
      #generate-btn:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 8px 35px rgba(245, 200, 66, 0.35);
      }
      #generate-btn:active {
        transform: translateY(0) scale(0.98);
      }
      #generate-btn .btn-icon {
        font-size: 1.3rem;
        transition: transform 0.4s;
      }
      #generate-btn:hover .btn-icon {
        transform: rotate(15deg) scale(1.15);
      }
      #generate-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          transparent 40%,
          rgba(255, 255, 255, 0.25) 50%,
          transparent 60%
        );
        transform: translateX(-100%);
        transition: transform 0.6s;
      }
      #generate-btn:hover::after {
        transform: translateX(100%);

        font-size: 0.8rem;

        opacity: 0.6;

          grid-template-columns: 1fr;
          gap: 2rem;

          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
          max-width: 100% !important;
        }

          padding: 1rem 0.5rem;
          font-size: 1rem;
        }
        #generate-btn {
          padding: 0.85rem 1.8rem;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>

      function rf() {
        return FILLER[Math.floor(Math.random() * FILLER.length)];
      }

      function buildText(fortune) {
        const fw = fortune.toLowerCase().split(/\s+/);
        const nw = 120 + Math.floor(Math.random() * 40);
        const pool = [];
        for (let i = 0; i < nw; i++) pool.push(rf());
        for (let i = pool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        const span = Math.floor(pool.length / (fw.length + 1));
        const pos = [];
        for (let i = 0; i < fw.length; i++) {
          const target = (i + 1) * span + Math.floor((Math.random() - 0.5) * 4);
          pos.push(Math.max(0, Math.min(pool.length - 1, target)));
        }
        pos.sort((a, b) => a - b);
        for (let i = 1; i < pos.length; i++) {
          if (pos[i] <= pos[i - 1]) pos[i] = pos[i - 1] + 1;
        }
        const placed = [];
        for (let i = 0; pos[pos.length - 1] >= pool.length; i++) pool.push(rf());
        for (let i = 0; i < fw.length; i++) {
          pool[pos[i]] = fw[i];
          placed.push({ word: fw[i], idx: pos[i] });
        }
        let formatted = "";
        let line = [];
        for (let i = 0; i < pool.length; i++) {
          line.push(`<span class="word" data-idx="${i}">${pool[i]}</span>`);
          if (
            line.length >= 8 + Math.floor(Math.random() * 5) ||
            i === pool.length - 1
          ) {
            formatted += line.join(" ") + "<br>";
            line = [];
          }
        }
        return { html: formatted, placed, total: pool.length, pool };
      }

      function findFortuneWords() {
        const targetWords = currentFortune.toLowerCase().split(/\s+/);
        const chosen = [];
        let searchIdx = 0;
        for (const tw of targetWords) {

          if (found === -1) {
            for (let i = 0; i < wordSpans.length; i++) {
              if (

                !chosen.includes(i)
              ) {

              }
            }
          }
          if (found !== -1) {
            chosen.push(found);
            searchIdx = found + 1;
          }
        }
        if (chosen.length < targetWords.length) return null;
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const idx of chosen) {
          const s = wordSpans[idx];
          if (!s) continue;
          const cx = s.offsetLeft + s.offsetWidth / 2,
            cy = s.offsetTop + s.offsetHeight / 2;
          const r = Math.max(s.offsetWidth, s.offsetHeight) / 2 + 18;
          if (cx - r < minX) minX = cx - r;
          if (cx + r > maxX) maxX = cx + r;
          if (cy - r < minY) minY = cy - r;
          if (cy + r > maxY) maxY = cy + r;
        }
        const textContainer = document.getElementById("text-container");
        const tbW = textContainer ? textContainer.clientWidth : 800,
          tbH = textContainer ? textContainer.clientHeight : 600;
        minX = Math.max(0, minX - 100);
        minY = Math.max(0, minY - 100);
        maxX = Math.min(tbW, maxX + 100);
        maxY = Math.min(tbH, maxY + 100);
        if (maxX - minX < 400) {

        }
        if (maxY - minY < 400) {

        minX = Math.max(0, minX);
        minY = Math.max(0, minY);
        maxX = Math.min(tbW, maxX);
        maxY = Math.min(tbH, maxY);
        return { wordIndices: chosen, box: { minX, minY, maxX, maxY } };

      // ============ CASCADE STOP ============
      function cascadeStop(cb) {
        stopShuffling();
        const n = wordSpans.length,

      function createCheeseOverlay(result) {
        const box = result.box,
          W = box.maxX - box.minX,
          H = box.maxY - box.minY,
          pad = 18;
        const wh = result.wordIndices.map((idx) => {

        const dh = [];
        let att = 0;

        const ns = "http://www.w3.org/2000/svg",

        svg.appendChild(defs);

        const rot = (px, py, cx, cy, th) => ({
          x: cx + (px - cx) * Math.cos(th) - (py - cy) * Math.sin(th),
          y: cy + (px - cx) * Math.sin(th) + (py - cy) * Math.cos(th),
        });
        const step = 40,
          pts = [],
          rp = () => 3 + Math.random() * 4,
          rw = () => (Math.random() - 0.5) * 5;
        for (let x = -5; x <= W + 5; x += step)
          pts.push({ x: x + rw(), y: -rp() });
        pts.push({ x: W + rp(), y: -rp() });
        for (let y = 0; y <= H; y += step)
          pts.push({ x: W + rp(), y: y + rw() });
        pts.push({ x: W + rp(), y: H + rp() });
        for (let x = W + 5; x >= -5; x -= step)
          pts.push({ x: x + rw(), y: H + rp() });
        pts.push({ x: -rp(), y: H + rp() });
        for (let y = H; y >= 0; y -= step) pts.push({ x: -rp(), y: y + rw() });
        pts.push({ x: -rp(), y: -rp() });
        const rpts = pts.map((p) => rot(p.x, p.y, cxR, cyR, angle));
        let d = `M ${rpts[0].x} ${rpts[0].y}`;
        for (let i = 1; i < rpts.length; i++)
          d += ` L ${rpts[i].x} ${rpts[i].y}`;
        d += " Z";
        const cheese = document.createElementNS(ns, "path");
        cheese.setAttribute("d", d);
        cheese.setAttribute("fill", "url(#cgrad)");
        cheese.setAttribute("mask", "url(#cmask)");
        svg.appendChild(cheese);

        for (let i = 0; i < 8; i++) {
          const line = document.createElementNS(ns, "line");
          let sx = Math.random() * W,
            sy = Math.random() * H;
          const p1 = rot(sx, sy, cxR, cyR, angle);
          const p2 = rot(
            sx + 20 + Math.random() * 50,
            sy + (Math.random() - 0.5) * 15,
            cxR,
            cyR,
            angle,
          );
          line.setAttribute("x1", p1.x);
          line.setAttribute("y1", p1.y);
          line.setAttribute("x2", p2.x);
          line.setAttribute("y2", p2.y);
          line.setAttribute("stroke", "rgba(160,120,0,0.12)");
          line.setAttribute("stroke-width", "1");
          line.setAttribute("mask", "url(#cmask)");
          svg.appendChild(line);
        }

        const ov = document.createElement("div");
        ov.id = "cheese-overlay-container";
        ov.style.position = "absolute";
        ov.style.zIndex = "10";
        ov.style.pointerEvents = "none";
        ov.style.width = W + "px";
        ov.style.height = H + "px";
        ov.style.left = box.minX + "px";
        ov.style.top = box.minY + "px";
        ov.appendChild(svg);
        const tb = document.getElementById("text-container");
        tb.style.position = "relative";
        tb.style.overflow = "visible";
        tb.appendChild(ov);
        const wr = document.getElementById("text-wrapper");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ov.classList.add("visible");
            setTimeout(() => {
              wr.classList.add("paper-shake");
              setTimeout(() => wr.classList.remove("paper-shake"), 500);
            }, 100);
          });
        });
      }

      // ============ CARD DOWNLOAD GENERATOR ============
      function downloadCard() {
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1350;
        const ctx = canvas.getContext("2d");

        // Background
        const bgGrad = ctx.createLinearGradient(0, 0, 0, 1350);
        bgGrad.addColorStop(0, "#12100c");
        bgGrad.addColorStop(0.5, "#0a0907");
        bgGrad.addColorStop(1, "#040302");
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, 1080, 1350);

        // Ambient radial glow behind cheese
        const glow = ctx.createRadialGradient(540, 650, 50, 540, 650, 550);
        glow.addColorStop(0, "rgba(245, 200, 66, 0.18)");
        glow.addColorStop(0.6, "rgba(245, 200, 66, 0.05)");
        glow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 1080, 1350);

        // Outer Decorative Frame
        ctx.strokeStyle = "rgba(245, 200, 66, 0.4)";
        ctx.lineWidth = 3;
        ctx.strokeRect(36, 36, 1008, 1278);

        ctx.strokeStyle = "rgba(245, 200, 66, 0.15)";
        ctx.lineWidth = 1;
        ctx.strokeRect(46, 46, 988, 1258);

        // Corner Accents
        const drawCorner = (x, y, dx, dy) => {
          ctx.strokeStyle = "#f5c842";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(x, y + dy * 22);
          ctx.lineTo(x, y);
          ctx.lineTo(x + dx * 22, y);
          ctx.stroke();
        };
        drawCorner(36, 36, 1, 1);
        drawCorner(1044, 36, -1, 1);
        drawCorner(36, 1314, 1, -1);
        drawCorner(1044, 1314, -1, -1);

        // Simplified Cheese Wedge Graphic
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.7)";
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 20;

        const cheeseGrad = ctx.createLinearGradient(200, 350, 880, 950);
        cheeseGrad.addColorStop(0, "#ffe066");
        cheeseGrad.addColorStop(0.3, "#f5c842");
        cheeseGrad.addColorStop(0.7, "#e6a817");
        cheeseGrad.addColorStop(1, "#c28b0a");

        ctx.beginPath();
        ctx.moveTo(220, 420);
        ctx.quadraticCurveTo(540, 360, 860, 420);
        ctx.quadraticCurveTo(890, 430, 880, 460);
        ctx.lineTo(800, 920);
        ctx.quadraticCurveTo(790, 950, 750, 950);
        ctx.lineTo(330, 950);
        ctx.quadraticCurveTo(290, 950, 280, 920);
        ctx.lineTo(200, 460);
        ctx.quadraticCurveTo(190, 430, 220, 420);
        ctx.closePath();

        ctx.fillStyle = cheeseGrad;
        ctx.fill();

        ctx.strokeStyle = "#a0740a";
        ctx.lineWidth = 4;
        ctx.stroke();
        ctx.restore();

        // Cheese Holes
        const holes = [
          { x: 340, y: 520, r: 42 },
          { x: 740, y: 500, r: 35 },
          { x: 540, y: 680, r: 55 },
          { x: 380, y: 820, r: 38 },
          { x: 700, y: 800, r: 46 },
          { x: 260, y: 660, r: 28 },
          { x: 820, y: 670, r: 30 }
        ];
        holes.forEach(h => {
          ctx.beginPath();
          ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
          ctx.fillStyle = "#0c0b09";
          ctx.fill();
          ctx.strokeStyle = "rgba(160, 116, 10, 0.6)";
          ctx.lineWidth = 3;
          ctx.stroke();
        });

        // Card Header Text
        ctx.textAlign = "center";
        ctx.fillStyle = "#f5c842";
        ctx.font = 'bold 36px "Playfair Display", serif';
        ctx.fillText("✦ THE CHEESE PROPHECY ✦", 540, 140);

        ctx.fillStyle = "#9a8e7a";
        ctx.font = '300 16px "Outfit", sans-serif';
        ctx.fillText("ORACLE OF TRUTH", 540, 175);

        // Golden Prophecy Text in Center
        ctx.save();
        ctx.shadowColor = "rgba(0, 0, 0, 0.9)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 4;
        ctx.fillStyle = "#ffffff";
        ctx.font = 'italic bold 44px "Playfair Display", serif';
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const wordsText = currentFortune || "The golden rind reveals the truth";
        const words = wordsText.split(" ");
        const lines = [];
        let currentLine = words[0];

        for (let i = 1; i < words.length; i++) {
          const testLine = currentLine + " " + words[i];
          if (ctx.measureText(testLine).width > 620) {
            lines.push(currentLine);
            currentLine = words[i];
          } else {
            currentLine = testLine;
          }
        }
        lines.push(currentLine);

        const startY = 650 - ((lines.length - 1) * 30);
        lines.forEach((line, idx) => {
          ctx.fillText(`"${line}"`, 540, startY + idx * 60);
        });
        ctx.restore();

        // Bottom Left Link & Attribution
        ctx.textAlign = "left";
        ctx.fillStyle = "#f5c842";
        ctx.font = 'bold 22px "Outfit", sans-serif';
        ctx.fillText("gabriradix.it/cheese-phrophecy", 70, 1205);

        ctx.fillStyle = "#9a8e7a";
        ctx.font = '300 15px "Outfit", sans-serif';
        ctx.fillText("SCAN TO GENERATE YOUR PROPHECY • NET ART ARTIFACT", 70, 1235);

        // Render Static SVG QR Code at Bottom Right
        const qrSize = 140;
        const qrX = 860;
        const qrY = 1120;

        const qrImg = new Image();
        qrImg.onload = function() {
          ctx.drawImage(qrImg, qrX, qrY, qrSize, qrSize);
          triggerDownload();
        };
        qrImg.onerror = function() {
          triggerDownload();
        };
        qrImg.src = "./qrcode.svg";

        function triggerDownload() {
          const link = document.createElement("a");
          link.download = `cheese-prophecy-card-${Date.now()}.png`;
          link.href = canvas.toDataURL("image/png");
          link.click();
        }
      }

      // ============ MAIN ============
      let rawWords = [],
        wordSpans = [],
        currentFortune = "",
        shuffleRAF = null,
        locked = [];

      const generateBtn = document.getElementById("generate-btn"),
        resetBtn = document.getElementById("reset-btn"),
        downloadCardBtn = document.getElementById("download-card-btn");

      generateBtn.addEventListener("click", () => {
        generateBtn.classList.add("loading");
        generateBtn.querySelector(".btn-icon").textContent = "⏳";
        generateBtn.disabled = true;

        window.parent.postMessage('force-compact-header', '*');

        cascadeStop(() => {
          const result = findFortuneWords();
          if (!result) {
            generateBtn.classList.remove("loading");
            generateBtn.querySelector(".btn-icon").textContent = "🧀";
            loadNewProphecy();
            return;
          }
          result.wordIndices.forEach((idx) =>
            wordSpans[idx].classList.add("haiku-word"),
          );
          createCheeseOverlay(result);
          const disp = document.getElementById("fortune-display");
          disp.innerHTML = `<h2>✦ The Prophecy ✦</h2><div id="fortune-text">${currentFortune}</div>`;
          disp.classList.add("visible");
          generateBtn.style.display = "none";
          resetBtn.style.display = "inline-flex";
          downloadCardBtn.style.display = "inline-flex";
          generateBtn.classList.remove("loading");
          generateBtn.querySelector(".btn-icon").textContent = "🧀";
        });
      });

      // ============ SHUFFLE ENGINE ============
      let lastShuffle = 0;
      function shuffleLoop(ts) {
        if (ts - lastShuffle > 80) {
          lastShuffle = ts;
          for (let i = 0; i < wordSpans.length; i++) {
            if (!locked[i]) wordSpans[i].textContent = rf();
          }
        }
        shuffleRAF = requestAnimationFrame(shuffleLoop);
      }
      function startShuffling() {
        if (shuffleRAF) cancelAnimationFrame(shuffleRAF);
        shuffleRAF = requestAnimationFrame(shuffleLoop);
      }
      function stopShuffling() {
        if (shuffleRAF) {
          cancelAnimationFrame(shuffleRAF);
          shuffleRAF = null;
        }
      }

      resetBtn.addEventListener("click", loadNewProphecy);
      downloadCardBtn.addEventListener("click", downloadCard);

      function loadNewProphecy() {
        stopShuffling();
        const ov = document.getElementById("cheese-overlay-container");
        if (ov) ov.remove();
        const disp = document.getElementById("fortune-display");
        disp.innerHTML = "";
        disp.classList.remove("visible");
        document.getElementById("generate-btn").style.display = "inline-flex";
        document.getElementById("generate-btn").disabled = false;
        document.getElementById("reset-btn").style.display = "none";
        document.getElementById("download-card-btn").style.display = "none";

        currentFortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
        const textData = buildText(currentFortune);
        rawWords = textData.pool;
        wordSpans = [];
        locked = new Array(textData.total).fill(false);
        const container = document.getElementById("text-container");
        container.innerHTML = textData.html;
        wordSpans = Array.from(container.querySelectorAll(".word"));
        document.getElementById("text-source").textContent =
          "— Textual Fermentation Pool";
        startShuffling();
      }

      // Execute loadNewProphecy immediately on DOM Ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', loadNewProphecy);
      } else {
        loadNewProphecy();
      }

      window.addEventListener("scroll", () => {
        if (window.scrollY > 50) {
          window.parent.postMessage('force-compact-header', '*');
        } else {
          window.parent.postMessage('reset-compact-header', '*');
        }
      });
    </script>
  </body>
</html>
