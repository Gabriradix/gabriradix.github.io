<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%" style="background: #080808; font-family: 'JetBrains Mono', 'Space Mono', monospace;">
  <defs>
    <pattern id="grid-mech" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141414" stroke-width="1"/>
    </pattern>

    <filter id="glow-bright" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="650" fill="#080808"/>
  <rect width="1200" height="650" fill="url(#grid-mech)"/>

  <!-- Frame Header -->
  <rect x="20" y="20" width="1160" height="610" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="40" y="48" fill="#666666" font-size="11" letter-spacing="2">TOPOLOGICAL GRAPH DYNAMICS &amp; FORCE KINETICS</text>
  <text x="1160" y="48" text-anchor="end" fill="#ffffff" font-size="11" letter-spacing="1">GRAPH_MECHANICS // 02</text>

  <!-- Left Column: Node Radius Scaling Engine -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="520" height="250" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="0" y="0" width="520" height="32" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="15" y="21" fill="#ffffff" font-size="11" font-weight="bold">A. DYNAMIC NODE RADIUS SCALING (R_node)</text>

    <!-- Radius comparison circles -->
    <g transform="translate(60, 140)">
      <!-- Small Node -->
      <circle cx="0" cy="0" r="12" fill="#111" stroke="#888" stroke-width="1.5"/>
      <text x="-15" y="32" fill="#888" font-size="9">Metric = 1.0</text>
      <text x="-12" y="45" fill="#555" font-size="8">R = 4px</text>
    </g>

    <g transform="translate(200, 140)">
      <!-- Medium Node -->
      <circle cx="0" cy="0" r="26" fill="#181818" stroke="#ccc" stroke-width="1.5"/>
      <text x="-20" y="46" fill="#ccc" font-size="9">Metric = 5.0</text>
      <text x="-15" y="59" fill="#555" font-size="8">R = 10px</text>
    </g>

    <g transform="translate(380, 140)">
      <!-- Large Active Node -->
      <circle cx="0" cy="0" r="44" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3,3"/>
      <circle cx="0" cy="0" r="38" fill="#ffffff" filter="url(#glow-bright)"/>
      <circle cx="0" cy="0" r="6" fill="#000000"/>
      <text x="-25" y="62" fill="#ffffff" font-size="10" font-weight="bold">Metric = 10.0</text>
      <text x="-15" y="75" fill="#888888" font-size="8">R = 18px</text>
    </g>

    <text x="15" y="232" fill="#777777" font-size="9">SIZE BY SELECTOR: [ IMPORTANCE | WEIRDNESS | MEMORY ]</text>
  </g>

  <!-- Right Column: Link Matching Criteria -->
  <g transform="translate(610, 80)">
    <rect x="0" y="0" width="540" height="250" fill="#0d0d0d" stroke="#2a2a2a" stroke-width="1"/>
    <rect x="0" y="0" width="540" height="32" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <text x="15" y="21" fill="#ffffff" font-size="11" font-weight="bold">B. CATEGORICAL LINK FORMATION ENGINE</text>

    <!-- Connect by items -->
    <g transform="translate(20, 55)">
      <!-- Link Item 1: Mood -->
      <rect x="0" y="0" width="150" height="40" fill="#111" stroke="#fff" stroke-width="1"/>
      <text x="12" y="24" fill="#fff" font-size="10" font-weight="bold">MOOD CLUSTER</text>
      
      <!-- Link Item 2: Setting -->
      <rect x="170" y="0" width="160" height="40" fill="#111" stroke="#333" stroke-width="1"/>
      <text x="12" y="24" fill="#888" font-size="10">SETTING MATCH</text>

      <!-- Link Item 3: Objects -->
      <rect x="350" y="0" width="150" height="40" fill="#111" stroke="#333" stroke-width="1"/>
      <text x="12" y="24" fill="#888" font-size="10">OBJECT TAGS</text>
    </g>

    <!-- Visual Link Connection Diagram -->
    <g transform="translate(20, 115)">
      <rect x="0" y="0" width="500" height="115" fill="#050505" stroke="#1f1f1f"/>
      
      <!-- Node A -->
      <circle cx="80" cy="55" r="18" fill="#fff" filter="url(#glow-bright)"/>
      <text x="65" y="60" fill="#000" font-size="10" font-weight="bold">N_A</text>

      <!-- Node B (Shared Mood) -->
      <circle cx="280" cy="30" r="14" fill="#fff"/>
      <text x="268" y="34" fill="#000" font-size="9" font-weight="bold">N_B</text>

      <!-- Node C (Shared Mood) -->
      <circle cx="420" cy="80" r="12" fill="#111" stroke="#fff" stroke-width="1.5"/>
      <text x="410" y="84" fill="#fff" font-size="9">N_C</text>

      <!-- Connection Lines -->
      <line x1="80" y1="55" x2="280" y2="30" stroke="#ffffff" stroke-width="2"/>
      <text x="170" y="32" fill="#ffffff" font-size="8">Shared "Anxiety"</text>

      <line x1="80" y1="55" x2="420" y2="80" stroke="#666666" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="230" y="85" fill="#777777" font-size="8">Shared "Mirrors"</text>
    </g>
  </g>

  <!-- Bottom Panel: Physics Force Field -->
  <g transform="translate(50, 355)">
    <rect x="0" y="0" width="1100" height="255" fill="#0c0c0c" stroke="#222222" stroke-width="1"/>
    <rect x="0" y="0" width="1100" height="32" fill="#141414" stroke="#222222" stroke-width="1"/>
    <text x="15" y="21" fill="#ffffff" font-size="11" font-weight="bold">C. D3 FORCE ATTRACTION &amp; REPULSION VECTOR FIELD</text>

    <g transform="translate(30, 50)">
      <!-- Physics Diagram Canvas -->
      <rect x="0" y="0" width="600" height="185" fill="#040404" stroke="#1c1c1c"/>

      <!-- Center Attraction Force -->
      <circle cx="300" cy="92" r="70" fill="none" stroke="#222222" stroke-width="1" stroke-dasharray="4,4"/>
      <circle cx="300" cy="92" r="40" fill="none" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="300" cy="92" r="3" fill="#ffffff"/>
      <text x="310" y="95" fill="#555555" font-size="8">FORCE_CENTER (x: 600, y: 350)</text>

      <!-- Repulsion Force Arrows -->
      <g transform="translate(180, 70)">
        <circle cx="0" cy="0" r="14" fill="#fff" filter="url(#glow-bright)"/>
        <!-- Repulsion Vector Outward -->
        <line x1="0" y1="0" x2="-35" y2="-25" stroke="#aaa" stroke-width="1.5" marker-end="url(#arrow)"/>
        <text x="-70" y="-30" fill="#888" font-size="8">F_repulsion (-250)</text>
      </g>

      <g transform="translate(420, 110)">
        <circle cx="0" cy="0" r="16" fill="#fff"/>
        <!-- Attraction Link Vector -->
        <line x1="0" y1="0" x2="-100" y2="-20" stroke="#fff" stroke-width="2"/>
        <text x="-90" y="0" fill="#fff" font-size="8">F_distance (80px)</text>
      </g>
    </g>

    <!-- Formula & Telemetry Specs Side Bar -->
    <g transform="translate(650, 50)">
      <rect x="0" y="0" width="420" height="185" fill="#040404" stroke="#1c1c1c"/>
      <text x="20" y="30" fill="#ffffff" font-size="10" font-weight="bold">MATHEMATICAL MODEL</text>

      <text x="20" y="55" fill="#888888" font-size="9">1. Many-Body Repulsion:</text>
      <text x="35" y="70" fill="#ffffff" font-size="9">F_rep = -k / (distance)^2</text>

      <text x="20" y="95" fill="#888888" font-size="9">2. Categorical Distance Attraction:</text>
      <text x="35" y="110" fill="#ffffff" font-size="9">d(N_i, N_j) = base_dist * (1 - Sim(i,j))</text>

      <text x="20" y="135" fill="#888888" font-size="9">3. Collision Prevention:</text>
      <text x="35" y="150" fill="#ffffff" font-size="9">Radius_collision = R_node + 4px padding</text>

      <rect x="20" y="163" width="380" height="1" fill="#222"/>
      <text x="20" y="177" fill="#555555" font-size="8">LIVE RENDERING ENGINE // HTML5 SVG + D3.JS FORCE SIMULATION</text>
    </g>
  </g>
</svg>
