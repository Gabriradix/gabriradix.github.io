<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc">
<title id="title">Dream Catalogue: What the graph encodes</title><desc id="desc">Metric values control size, shared attributes create links, and forces position nodes.</desc>
<rect x="0" y="0" width="900" height="600" fill="#101010" stroke="#101010"/><text x="40" y="54" fill="#b5b5b5" font-size="20" font-family="Helvetica, Arial, sans-serif">Dream Catalogue</text><text x="40" y="108" fill="#e5e5e5" font-size="34" font-family="Helvetica, Arial, sans-serif">What the graph encodes</text><path d="M40 140L860 140" fill="none" stroke="#404040" stroke-width="2"/><path d="M105 300L270 245" fill="none" stroke="#e5e5e5" stroke-width="2"/><circle cx="105" cy="300" r="31.2" fill="#171717" stroke="#e5e5e5" stroke-width="2"/><circle cx="270" cy="245" r="52.8" fill="#171717" stroke="#e5e5e5" stroke-width="2"/><circle cx="380" cy="340" r="20.4" fill="#171717" stroke="#e5e5e5" stroke-width="2"/><text x="91" y="307" fill="#e5e5e5" font-size="22" font-family="Helvetica, Arial, sans-serif">30</text><text x="256" y="252" fill="#e5e5e5" font-size="22" font-family="Helvetica, Arial, sans-serif">70</text><text x="369" y="347" fill="#e5e5e5" font-size="20" font-family="Helvetica, Arial, sans-serif">10</text><text x="40" y="420" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Example metric values.</text><text x="40" y="452.2" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Linked dreams share an attribute.</text><text x="480" y="200" fill="#e5e5e5" font-size="26" font-family="Helvetica, Arial, sans-serif">Size</text><text x="480" y="234" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Importance, weirdness or memory.</text><text x="480" y="266.2" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Higher value, larger node.</text><text x="480" y="320" fill="#e5e5e5" font-size="26" font-family="Helvetica, Arial, sans-serif">Links</text><text x="480" y="354" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Shared attributes according</text><text x="480" y="386.2" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">to the selected filter.</text><text x="480" y="440" fill="#e5e5e5" font-size="26" font-family="Helvetica, Arial, sans-serif">Position</text><text x="480" y="474" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Links attract; nodes repel.</text><text x="480" y="506.2" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Collisions limit overlap.</text><path d="M40 525L860 525" fill="none" stroke="#404040" stroke-width="2"/><text x="40" y="566" fill="#b5b5b5" font-size="23" font-family="Garamond, Georgia, serif">Size, connections and position encode different aspects of a dream.</text>
</svg>
