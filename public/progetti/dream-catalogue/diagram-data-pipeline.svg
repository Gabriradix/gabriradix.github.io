<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc">
<title id="title">Dream Catalogue: From dream to archive</title><desc id="desc">Record a dream. Memory and attributes become a structured record. Choose the criteria. One filter connects dreams; one metric sets their size. Build relationships. Shared attributes create links. Forces position the nodes. Explore the archive. Select a dream to read it and see its connections.</desc>
<rect x="0" y="0" width="900" height="600" fill="#101010" stroke="#101010"/><text x="40" y="54" fill="#b5b5b5" font-size="20" font-family="Helvetica, Arial, sans-serif">Dream Catalogue</text><text x="40" y="108" fill="#e5e5e5" font-size="34" font-family="Helvetica, Arial, sans-serif">From dream to archive</text><path d="M40 140L860 140" fill="none" stroke="#404040" stroke-width="2"/><path d="M40 174L405 174" fill="none" stroke="#e5e5e5" stroke-width="2"/><text x="40" y="210" fill="#e5e5e5" font-size="20" font-family="Helvetica, Arial, sans-serif">01</text><text x="40" y="252" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Record a dream</text><text x="40" y="292" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Memory and attributes</text><text x="40" y="325.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">become a structured record.</text><path d="M475 174L840 174" fill="none" stroke="#e5e5e5" stroke-width="2"/><text x="475" y="210" fill="#e5e5e5" font-size="20" font-family="Helvetica, Arial, sans-serif">02</text><text x="475" y="252" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Choose the criteria</text><text x="475" y="292" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">One filter connects dreams;</text><text x="475" y="325.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">one metric sets their size.</text><path d="M40 349L405 349" fill="none" stroke="#e5e5e5" stroke-width="2"/><text x="40" y="385" fill="#e5e5e5" font-size="20" font-family="Helvetica, Arial, sans-serif">03</text><text x="40" y="427" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Build relationships</text><text x="40" y="467" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Shared attributes create links.</text><text x="40" y="500.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Forces position the nodes.</text><path d="M475 349L840 349" fill="none" stroke="#e5e5e5" stroke-width="2"/><text x="475" y="385" fill="#e5e5e5" font-size="20" font-family="Helvetica, Arial, sans-serif">04</text><text x="475" y="427" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Explore the archive</text><text x="475" y="467" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Select a dream to read it</text><text x="475" y="500.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">and see its connections.</text><text x="40" y="568" fill="#b5b5b5" font-size="22" font-family="Garamond, Georgia, serif">Follow the four stages in reading order.</text>
</svg>
