<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Street Rendering Embed</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; }
        #canvas-container { width: 100vw; height: 100vh; }
        #loading-screen { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: transparent; color: #fff; font-family: sans-serif; transition: opacity 0.5s; z-index: 10; }
        .hidden { opacity: 0; pointer-events: none; }
        .loader-content { text-align: center; transform: translateY(140px); }
        .progress-bar { width: 200px; height: 2px; background: #333; margin: 10px auto; }
        #progress { width: 0%; height: 100%; background: #fff; transition: width 0.2s; }
    </style>
    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <!-- Import map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="loading-screen">
        <div class="loader-content">
            <div style="letter-spacing: 2px; font-size: 12px; margin-bottom: 8px;">LOADING POINT CLOUD</div>
            <div class="progress-bar"><div id="progress"></div></div>
        </div>
    </div>
    <div id="canvas-container"></div>
    <script type="module">
        import * as THREE from 'three';
        import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -0.5, 2);
        
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        // Clamp pixel ratio to improve performance on high-DPI screens
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.target.set(0, -1.0, 0);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1);
        scene.add(ambientLight);

        let pointCloud;
        const loader = new PLYLoader();
        loader.load(
            'assets/pointcloud.ply',
            function (geometry) {
                // Removed geometry.computeVertexNormals() - extremely slow and unnecessary for PointsMaterial
                geometry.computeBoundingBox();
                geometry.center();

                const size = new THREE.Vector3();
                geometry.boundingBox.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                const scaleFactor = 15 / maxDim;

                const material = new THREE.PointsMaterial({
                    size: 0.02,
                    vertexColors: true,
                    sizeAttenuation: true
                });

                pointCloud = new THREE.Points(geometry, material);
                pointCloud.scale.set(scaleFactor, scaleFactor, scaleFactor);
                pointCloud.rotation.x = -Math.PI / 2;
                pointCloud.position.y = 0;

                scene.add(pointCloud);

                document.getElementById('loading-screen').classList.add('hidden');
            },
            (xhr) => {
                const percent = Math.min(100, (xhr.loaded / xhr.total * 100));
                document.getElementById('progress').style.width = percent + '%';
            },
            (error) => {
                console.error('Error loading PLY', error);
            }
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
