<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Prophecy</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600;700&family=Roboto:wght@300&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0f0e0c;
        --bg-card: #1a1814;
        --gold: #f5c842;
        --gold-amber: #e6a817;
        --gold-dark: #c28b0a;
        --gold-light: #ffe066;
        --cream: #fdf6e3;
        --text: #f0e6d2;
        --text-dim: #9a8e7a;
        --radius: 16px;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Outfit", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
      }
      .home-link {
        position: fixed;
        top: 1.5rem;
        left: 1.5rem;
        z-index: 1000;
        font-family: "Roboto", sans-serif;
        font-size: 2rem;
        font-weight: 300;
        color: var(--text-dim);
        text-decoration: none;
        line-height: 1;
        transition: color 0.3s;
        padding: 15px;
        margin: -15px;
      }
      .home-link:hover {
        color: var(--gold);
      }
      .container {
        position: relative;
        z-index: 1;
        max-width: 1100px;
        margin: 0 auto;
        padding: 2rem 1.5rem;
      }
      header {
        text-align: center;
        padding: 3rem 0 2rem;
      }
      header h1 {
        font-family: "Playfair Display", serif;
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 700;
        background: linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold),
          var(--gold-amber)
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
        line-height: 1.1;
        margin-bottom: 0.5rem;
      }
      header .subtitle {
        font-size: 0.95rem;
        color: var(--text-dim);
        margin-top: 0.5rem;
        font-weight: 300;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      .actions {
        display: flex;
        justify-content: center;
        min-height: 60px;
        margin: 2rem 0;
        gap: 1rem;
      }
      #generate-btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 1rem 2.5rem;
        font-family: "Outfit", sans-serif;
        font-size: 1.05rem;
        font-weight: 600;
        color: var(--bg);
        background: linear-gradient(135deg, var(--gold), var(--gold-amber));
        border: none;
        border-radius: 50px;
        cursor: pointer;
        overflow: hidden;
        transition:
          transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.3s;
        box-shadow: 0 4px 25px rgba(245, 200, 66, 0.25);
      }
      #generate-btn:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 8px 35px rgba(245, 200, 66, 0.35);
      }
      #generate-btn:active {
        transform: translateY(0) scale(0.98);
      }
      #generate-btn .btn-icon {
        font-size: 1.3rem;
        transition: transform 0.4s;
      }
      #generate-btn:hover .btn-icon {
        transform: rotate(15deg) scale(1.15);
      }
      #generate-btn::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          transparent 40%,
          rgba(255, 255, 255, 0.25) 50%,
          transparent 60%
        );
        transform: translateX(-100%);
        transition: transform 0.6s;
      }
      #generate-btn:hover::after {
        transform: translateX(100%);
      }
      @keyframes pulse-glow {
        0%,
        100% {
          box-shadow: 0 4px 25px rgba(245, 200, 66, 0.25);
        }
        50% {
          box-shadow: 0 4px 40px rgba(245, 200, 66, 0.5);
        }
      }
      #generate-btn.loading {
        animation: pulse-glow 1s infinite;
        pointer-events: none;
      }
      #reset-btn {
        display: none;
        padding: 0.6rem 1.8rem;
        font-family: "Outfit", sans-serif;
        font-size: 0.9rem;
        font-weight: 400;
        color: var(--text-dim);
        background: transparent;
        border: 1px solid rgba(245, 200, 66, 0.2);
        border-radius: 50px;
        cursor: pointer;
        transition: all 0.3s;
      }
      #reset-btn:hover {
        color: var(--gold);
        border-color: var(--gold);
        box-shadow: 0 0 20px rgba(245, 200, 66, 0.1);
      }
      .layout-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3rem;
        align-items: start;
      }
      @media (max-width: 900px) {
        .layout-grid {
          grid-template-columns: 1fr;
          gap: 2rem;
        }
      }
      #text-wrapper {
        position: relative;
      }
      #text-container {
        position: relative;
        background: transparent;
        border: none;
        padding: 2.5rem 2rem;
        line-height: 1.8;
        font-family: "Playfair Display", serif;
        font-size: 1.3rem;
        color: var(--cream);
      }
      #text-container .word {
        display: inline;
        transition:
          color 0.3s,
          text-shadow 0.3s;
        cursor: default;
        position: relative;
      }
      #text-container .word:hover {
        color: var(--gold);
        text-shadow: 0 0 20px rgba(245, 200, 66, 0.3);
      }
      #text-container .word.haiku-word {
        color: var(--gold);
        font-weight: 700;
        text-shadow: 0 0 15px rgba(245, 200, 66, 0.4);
        z-index: 20;
        position: relative;
      }
      .text-source {
        text-align: right;
        margin-top: 1rem;
        font-size: 0.85rem;
        color: var(--text-dim);
        font-style: italic;
      }
      #cheese-overlay-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 15;
        pointer-events: none;
        overflow: visible;
        opacity: 0;
        transform: scale(20);
        transform-origin: center;
        will-change: transform, opacity;
      }
      @keyframes cheese-slap {
        0% {
          opacity: 0;
          transform: scale(20) rotate(10deg);
        }
        20% {
          opacity: 1;
          transform: scale(0.96) rotate(-2deg);
        }
        45% {
          transform: scale(1.02) rotate(1deg);
        }
        65% {
          transform: scale(0.98) rotate(-0.5deg);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      #cheese-overlay-container.visible {
        animation: cheese-slap 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      @keyframes paper-impact {
        0% {
          transform: translateY(0);
        }
        15% {
          transform: translateY(8px) scale(0.98);
        }
        35% {
          transform: translateY(-4px) scale(1.01);
        }
        55% {
          transform: translateY(2px);
        }
        100% {
          transform: translateY(0);
        }
      }
      .paper-shake {
        animation: paper-impact 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97)
          forwards;
      }
      #fortune-display {
        text-align: center;
        padding: 2rem;
        opacity: 0;
        transition: opacity 0.6s 0.6s;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 350px;
      }
      #fortune-display.visible {
        opacity: 1;
      }
      #fortune-display h2 {
        font-family: "Playfair Display", serif;
        font-size: 1.1rem;
        color: var(--gold);
        margin-bottom: 2rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        width: 100%;
      }
      #fortune-text {
        font-family: "Playfair Display", serif;
        font-size: clamp(1.4rem, 3vw, 2.2rem);
        font-style: italic;
        font-weight: 700;
        color: var(--cream);
        text-shadow: 0 4px 15px rgba(245, 200, 66, 0.2);
        line-height: 1.5;
        max-width: 400px;
      }
      footer {
        text-align: center;
        padding: 3rem 0 2rem;
        font-size: 0.8rem;
        color: var(--text-dim);
        opacity: 0.6;
      }
      @media (max-width: 600px) {
        .container {
          padding: 1rem;
        }
        #text-container {
          padding: 1.5rem 1rem;
          font-size: 1rem;
        }
        #generate-btn {
          padding: 0.85rem 1.8rem;
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="/" target="_parent" class="home-link">√</a>
    <div class="container">
      <header>
        <h1>Cheese Prophecies</h1>
        <p class="subtitle">Fortune through fermentation</p>
        <div class="actions">
          <button id="generate-btn">
            <span class="btn-icon">🧀</span><span>Find the Prophecy</span>
          </button>
          <button id="reset-btn">↻ New prophecy</button>
        </div>
      </header>
      <div class="layout-grid">
        <div class="col-left">
          <div id="text-wrapper">
            <div id="text-container">
              <p
                style="
                  text-align: center;
                  color: var(--text-dim);
                  padding: 2rem;
                "
              >
                Loading…
              </p>
            </div>
          </div>
          <p class="text-source" id="text-source">— Selecting…</p>
        </div>
        <div class="col-right"><div id="fortune-display"></div></div>
      </div>
      <footer>Cheese Prophecies — Creative Coding Experiment</footer>
    </div>
    <script>
      const FORTUNES = [
        "Change arrives when silence speaks",
        "Trust the path you cannot see",
        "What you seek is already within",
        "The answer hides in plain sight",
        "Let go and the door will open",
        "Your strength grows in the darkness",
        "Time reveals what words cannot",
        "The wind carries forgotten truths",
        "Look closer and see further",
        "Every ending holds a seed",
        "Still water reflects the stars",
        "The flame within never dies",
        "Accept the storm and find peace",
        "What was lost shall return transformed",
        "Patience unravels every knot",
        "The moon remembers what the sun forgets",
        "A single step changes everything",
        "Courage lives where fear once stood",
        "The broken path leads somewhere new",
        "Silence teaches louder than thunder",
        "Your shadow knows your light",
        "The answer lies beyond the question",
        "Seeds grow best in humble soil",
        "Release the weight and learn to fly",
        "The river finds its way without a map",
        "What blooms in darkness shines the brightest",
        "The hand that gives also receives",
        "Nothing is wasted on the journey",
        "The key was always in your pocket",
        "Morning follows every night without fail",
        "Embrace the void to find the form",
        "Echoes of tomorrow sing in today",
        "The longest journey begins standing still",
        "Roots deepen when the winter bites",
        "Hidden currents guide the drifting leaf",
        "To find the light embrace the shadow",
        "Whispers of the past shape the future",
        "A calm sea hides a deep mind",
        "Let the rain wash away the doubt",
        "Sparks fly when the flint is struck",
        "The mountain yields only to time",
        "Dreams are the maps of waking life",
        "Quiet the mind to hear the soul",
        "Every fallen leaf nourishes the earth",
        "The dawn waits for no one",
        "Even the longest night must end",
        "Paths are made by walking them",
        "The compass spins when truth is near",
        "Only the empty vessel can be filled",
        "Stars shine brightest in the blackest sky",
        "The falling snow buries old sorrows",
        "Mirrors show only what you bring",
        "A steady hand tames the wildest storm",
        "The seed knows the shape of the tree",
        "Listen to the space between the words",
        "The river never looks back",
        "Tides rise and fall with the moon",
        "Fire warms the hands that feed it",
        "The highest branch catches the most wind",
        "Let the ashes blow away",
      ];
      const FILLER = [
        "ancient",
        "whisper",
        "shadow",
        "eternal",
        "dream",
        "wander",
        "horizon",
        "crystal",
        "ember",
        "silver",
        "twilight",
        "echo",
        "gentle",
        "cosmos",
        "breath",
        "ivory",
        "velvet",
        "aurora",
        "sacred",
        "hollow",
        "mystic",
        "ocean",
        "silent",
        "dusk",
        "amber",
        "ghost",
        "marble",
        "tender",
        "winter",
        "ether",
        "cipher",
        "prism",
        "orchid",
        "vapor",
        "summit",
        "radiant",
        "vessel",
        "pilgrim",
        "solemn",
        "woven",
        "through",
        "within",
        "beyond",
        "across",
        "beneath",
        "among",
        "between",
        "toward",
        "upon",
        "over",
        "under",
        "along",
        "before",
        "after",
        "until",
        "during",
        "the",
        "a",
        "an",
        "of",
        "and",
        "in",
        "to",
        "from",
        "with",
        "by",
        "on",
        "at",
        "for",
        "each",
        "every",
        "all",
        "some",
        "many",
        "few",
        "one",
        "this",
        "that",
        "these",
        "like",
        "as",
        "so",
        "yet",
        "but",
        "or",
        "nor",
        "if",
        "then",
        "thus",
        "hence",
        "deep",
        "soft",
        "vast",
        "pale",
        "cold",
        "warm",
        "bright",
        "dark",
        "slow",
        "still",
        "rises",
        "falls",
        "turns",
        "flows",
        "grows",
        "fades",
        "burns",
        "waits",
        "moves",
        "rests",
        "knowing",
        "seeking",
        "turning",
        "holding",
        "watching",
        "feeling",
        "reaching",
        "becoming",
      ];
      const rf = () => FILLER[Math.floor(Math.random() * FILLER.length)];

      function generateOracleText(fortune) {
        const fw = fortune.toLowerCase().split(/\s+/);
        const lines = [];
        let fi = 0;
        const tl = 8 + Math.floor(Math.random() * 5);
        const sp = Math.max(1, Math.floor(tl / fw.length));
        for (let i = 0; i < tl; i++) {
          const wc = 4 + Math.floor(Math.random() * 5);
          const lw = [];
          const embed =
            fi < fw.length &&
            (i % sp === Math.floor(sp / 2) || (i === tl - 1 && fi < fw.length));
          const ep = embed ? Math.floor(Math.random() * wc) : -1;
          for (let j = 0; j < wc; j++) {
            if (j === ep && fi < fw.length) {
              lw.push(fw[fi]);
              fi++;
            } else {
              lw.push(rf());
            }
          }
          lines.push(lw.join(" "));
        }
        while (fi < fw.length) {
          const e = [];
          for (let j = 0; j < 5; j++) {
            if (fi < fw.length && j === 2) {
              e.push(fw[fi]);
              fi++;
            } else {
              e.push(rf());
            }
          }
          lines.push(e.join(" "));
        }
        return lines.join("\n");
      }

      const textContainer = document.getElementById("text-container");
      const sourceLabel = document.getElementById("text-source");
      let rawWords = [],
        wordSpans = [],
        finalWords = [],
        currentFortune = "";
      let shuffleRAF = null,
        locked = [];

      // ============ SHUFFLE via rAF ============
      let lastShuffle = 0;
      function shuffleLoop(ts) {
        if (ts - lastShuffle > 80) {
          lastShuffle = ts;
          for (let i = 0; i < wordSpans.length; i++) {
            if (!locked[i]) wordSpans[i].textContent = rf();
          }
        }
        shuffleRAF = requestAnimationFrame(shuffleLoop);
      }
      function startShuffling() {
        if (shuffleRAF) cancelAnimationFrame(shuffleRAF);
        shuffleRAF = requestAnimationFrame(shuffleLoop);
      }
      function stopShuffling() {
        if (shuffleRAF) {
          cancelAnimationFrame(shuffleRAF);
          shuffleRAF = null;
        }
      }

      // ============ LOAD ============
      function loadNewProphecy() {
        stopShuffling();
        const ov = document.getElementById("cheese-overlay-container");
        if (ov) ov.remove();
        const disp = document.getElementById("fortune-display");
        disp.innerHTML = "";
        disp.classList.remove("visible");
        document.getElementById("generate-btn").style.display = "inline-flex";
        document.getElementById("generate-btn").disabled = false;
        document.getElementById("reset-btn").style.display = "none";

        currentFortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
        const oracleText = generateOracleText(currentFortune);
        const lines = oracleText.split("\n");
        textContainer.innerHTML = "";
        rawWords = [];
        wordSpans = [];
        finalWords = [];
        locked = [];

        lines.forEach((line) => {
          const div = document.createElement("div");
          if (!line.trim()) div.style.height = "1.5em";
          line.split(/(\s+)/).forEach((part) => {
            if (part.trim().length > 0) {
              const span = document.createElement("span");
              span.className = "word";
              span.style.display = "inline-block";
              span.style.verticalAlign = "bottom";
              span.style.overflow = "hidden";
              span.style.whiteSpace = "nowrap";
              span.style.textOverflow = "clip";
              span.textContent = part;
              span.dataset.index = rawWords.length;
              div.appendChild(span);
              rawWords.push(part);
              finalWords.push(part);
              wordSpans.push(span);
              locked.push(false);
            } else if (part.length > 0) {
              // Ensure whitespace is preserved consistently
              const ws = document.createElement("span");
              ws.textContent = part;
              ws.style.display = "inline-block";
              ws.style.whiteSpace = "pre";
              div.appendChild(ws);
            }
          });
          textContainer.appendChild(div);
        });

        // Freeze widths based on the final text to prevent dancing
        requestAnimationFrame(() => {
          wordSpans.forEach((span) => {
            span.style.width = Math.ceil(span.offsetWidth + 2) + "px";
            span.style.textAlign = "center";
          });
          sourceLabel.innerHTML = "— The Oracle of Cheese";
          startShuffling();
        });
      }

      // ============ FIND FORTUNE WORDS ============
      function findFortuneWords() {
        const fw = currentFortune.toLowerCase().split(/\s+/);
        const chosen = [];
        let last = -2;
        for (const w of fw) {
          const t = w.replace(/[^a-z']/g, "");
          if (!t) continue;
          for (let i = Math.max(0, last + 1); i < finalWords.length; i++) {
            if (finalWords[i].toLowerCase().replace(/[^a-z']/g, "") === t) {
              chosen.push(i);
              last = i;
              break;
            }
          }
        }
        if (!chosen.length) return null;
        let minX = Infinity,
          minY = Infinity,
          maxX = -Infinity,
          maxY = -Infinity;
        for (const idx of chosen) {
          const s = wordSpans[idx];
          if (!s) continue;
          const cx = s.offsetLeft + s.offsetWidth / 2,
            cy = s.offsetTop + s.offsetHeight / 2;
          const r = Math.max(s.offsetWidth, s.offsetHeight) / 2 + 18;
          if (cx - r < minX) minX = cx - r;
          if (cx + r > maxX) maxX = cx + r;
          if (cy - r < minY) minY = cy - r;
          if (cy + r > maxY) maxY = cy + r;
        }
        const tbW = textContainer.clientWidth,
          tbH = textContainer.clientHeight;
        minX = Math.max(0, minX - 100);
        minY = Math.max(0, minY - 100);
        maxX = Math.min(tbW, maxX + 100);
        maxY = Math.min(tbH, maxY + 100);
        if (maxX - minX < 400) {
          minX -= 150;
          maxX += 150;
        }
        if (maxY - minY < 400) {
          minY -= 150;
          maxY += 150;
        }
        minX = Math.max(0, minX);
        minY = Math.max(0, minY);
        maxX = Math.min(tbW, maxX);
        maxY = Math.min(tbH, maxY);
        return { wordIndices: chosen, box: { minX, minY, maxX, maxY } };
      }

      // ============ CASCADE STOP ============
      function cascadeStop(cb) {
        stopShuffling();
        const n = wordSpans.length,
          dur = 250,
          pw = dur / n;
        // Keep shuffling unlocked words manually during cascade
        const cascadeRAF = { id: null };
        let cascadeLastShuffle = 0;
        function cascadeShuffle(ts) {
          if (ts - cascadeLastShuffle > 80) {
            cascadeLastShuffle = ts;
            for (let i = 0; i < n; i++) {
              if (!locked[i]) wordSpans[i].textContent = rf();
            }
          }
          if (locked.some((l) => !l))
            cascadeRAF.id = requestAnimationFrame(cascadeShuffle);
        }
        cascadeRAF.id = requestAnimationFrame(cascadeShuffle);

        for (let i = 0; i < n; i++) {
          setTimeout(() => {
            locked[i] = true;
            wordSpans[i].textContent = finalWords[i];
            wordSpans[i].style.color = "#f5c842";
            setTimeout(() => {
              wordSpans[i].style.color = "";
            }, 200);
          }, i * pw);
        }
        setTimeout(
          () => {
            if (cascadeRAF.id) cancelAnimationFrame(cascadeRAF.id);
            cb();
          },
          n * pw + 300,
        );
      }

      // ============ CHEESE OVERLAY ============
      function createCheeseOverlay(result) {
        const ex = document.getElementById("cheese-overlay-container");
        if (ex) ex.remove();
        const box = result.box,
          W = box.maxX - box.minX,
          H = box.maxY - box.minY,
          pad = 18;
        const wh = result.wordIndices.map((idx) => {
          const s = wordSpans[idx];
          return {
            cx: s.offsetLeft - box.minX + s.offsetWidth / 2,
            cy: s.offsetTop - box.minY + s.offsetHeight / 2,
            r: Math.max(s.offsetWidth, s.offsetHeight) / 2 + pad,
          };
        });
        const dh = [];
        let att = 0;
        const md = Math.max(0, 18 - wh.length);
        while (dh.length < md && att < 500) {
          att++;
          const r = 10 + Math.random() * 20;
          const cx = Math.max(r, Math.min(W - r, Math.random() * W));
          const cy = Math.max(r, Math.min(H - r, Math.random() * H));
          const dist = (a, b) => Math.sqrt((cx - a) ** 2 + (cy - b) ** 2);
          if (
            !wh.some((h) => dist(h.cx, h.cy) < h.r + r + 8) &&
            !dh.some((h) => dist(h.cx, h.cy) < h.r + r + 8)
          )
            dh.push({ cx, cy, r });
        }

        const ns = "http://www.w3.org/2000/svg",
          svg = document.createElementNS(ns, "svg");
        const ep = Math.max(W, H) * 0.5 + 100;
        svg.setAttribute("width", W + ep * 2);
        svg.setAttribute("height", H + ep * 2);
        svg.setAttribute(
          "viewBox",
          `${-ep} ${-ep} ${W + ep * 2} ${H + ep * 2}`,
        );
        svg.style.cssText = `position:absolute;top:${-ep}px;left:${-ep}px;width:${W + ep * 2}px;height:${H + ep * 2}px;`;
        const defs = document.createElementNS(ns, "defs");
        const mask = document.createElementNS(ns, "mask");
        mask.setAttribute("id", "cmask");
        const mbg = document.createElementNS(ns, "rect");
        mbg.setAttribute("x", -ep);
        mbg.setAttribute("y", -ep);
        mbg.setAttribute("width", W + ep * 2);
        mbg.setAttribute("height", H + ep * 2);
        mbg.setAttribute("fill", "white");
        mask.appendChild(mbg);
        const angle = ((Math.random() * 30 - 15) * Math.PI) / 180,
          cxR = W / 2,
          cyR = H / 2;
        [...wh, ...dh].forEach((h) => {
          const c = document.createElementNS(ns, "circle");
          c.setAttribute("cx", h.cx);
          c.setAttribute("cy", h.cy);
          c.setAttribute("r", h.r);
          c.setAttribute("fill", "black");
          mask.appendChild(c);
        });
        defs.appendChild(mask);
        const grad = document.createElementNS(ns, "linearGradient");
        grad.setAttribute("id", "cgrad");
        [
          ["0%", "#fde68a"],
          ["30%", "#f5c842"],
          ["60%", "#e6a817"],
          ["100%", "#d4a00a"],
        ].forEach(([o, c]) => {
          const s = document.createElementNS(ns, "stop");
          s.setAttribute("offset", o);
          s.setAttribute("stop-color", c);
          grad.appendChild(s);
        });
        defs.appendChild(grad);
        svg.appendChild(defs);

        const rot = (px, py, cx, cy, th) => ({
          x: cx + (px - cx) * Math.cos(th) - (py - cy) * Math.sin(th),
          y: cy + (px - cx) * Math.sin(th) + (py - cy) * Math.cos(th),
        });
        const step = 40,
          pts = [],
          rp = () => 3 + Math.random() * 4,
          rw = () => (Math.random() - 0.5) * 5;
        for (let x = -5; x <= W + 5; x += step)
          pts.push({ x: x + rw(), y: -rp() });
        pts.push({ x: W + rp(), y: -rp() });
        for (let y = 0; y <= H; y += step)
          pts.push({ x: W + rp(), y: y + rw() });
        pts.push({ x: W + rp(), y: H + rp() });
        for (let x = W + 5; x >= -5; x -= step)
          pts.push({ x: x + rw(), y: H + rp() });
        pts.push({ x: -rp(), y: H + rp() });
        for (let y = H; y >= 0; y -= step) pts.push({ x: -rp(), y: y + rw() });
        pts.push({ x: -rp(), y: -rp() });
        const rpts = pts.map((p) => rot(p.x, p.y, cxR, cyR, angle));
        let d = `M ${rpts[0].x} ${rpts[0].y}`;
        for (let i = 1; i < rpts.length; i++)
          d += ` L ${rpts[i].x} ${rpts[i].y}`;
        d += " Z";
        const cheese = document.createElementNS(ns, "path");
        cheese.setAttribute("d", d);
        cheese.setAttribute("fill", "url(#cgrad)");
        cheese.setAttribute("mask", "url(#cmask)");
        svg.appendChild(cheese);

        for (let i = 0; i < 8; i++) {
          const line = document.createElementNS(ns, "line");
          let sx = Math.random() * W,
            sy = Math.random() * H;
          const p1 = rot(sx, sy, cxR, cyR, angle);
          const p2 = rot(
            sx + 20 + Math.random() * 50,
            sy + (Math.random() - 0.5) * 15,
            cxR,
            cyR,
            angle,
          );
          line.setAttribute("x1", p1.x);
          line.setAttribute("y1", p1.y);
          line.setAttribute("x2", p2.x);
          line.setAttribute("y2", p2.y);
          line.setAttribute("stroke", "rgba(160,120,0,0.12)");
          line.setAttribute("stroke-width", "1");
          line.setAttribute("mask", "url(#cmask)");
          svg.appendChild(line);
        }

        const ov = document.createElement("div");
        ov.id = "cheese-overlay-container";
        ov.style.width = W + "px";
        ov.style.height = H + "px";
        ov.style.left = box.minX + "px";
        ov.style.top = box.minY + "px";
        ov.appendChild(svg);
        const tb = document.getElementById("text-container");
        tb.style.position = "relative";
        tb.style.overflow = "visible";
        tb.appendChild(ov);
        const wr = document.getElementById("text-wrapper");
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ov.classList.add("visible");
            setTimeout(() => {
              wr.classList.add("paper-shake");
              setTimeout(() => wr.classList.remove("paper-shake"), 500);
            }, 100);
          });
        });
      }

      // ============ MAIN ============
      const generateBtn = document.getElementById("generate-btn"),
        resetBtn = document.getElementById("reset-btn");
      generateBtn.addEventListener("click", () => {
        generateBtn.classList.add("loading");
        generateBtn.querySelector(".btn-icon").textContent = "⏳";
        generateBtn.disabled = true;
        cascadeStop(() => {
          const result = findFortuneWords();
          if (!result) {
            generateBtn.classList.remove("loading");
            generateBtn.querySelector(".btn-icon").textContent = "🧀";
            loadNewProphecy();
            return;
          }
          result.wordIndices.forEach((idx) =>
            wordSpans[idx].classList.add("haiku-word"),
          );
          createCheeseOverlay(result);
          const disp = document.getElementById("fortune-display");
          disp.innerHTML = `<h2>✦ The Prophecy ✦</h2><div id="fortune-text">${currentFortune}</div>`;
          disp.classList.add("visible");
          generateBtn.style.display = "none";
          resetBtn.style.display = "inline-block";
          generateBtn.classList.remove("loading");
          generateBtn.querySelector(".btn-icon").textContent = "🧀";
        });
      });
      resetBtn.addEventListener("click", loadNewProphecy);
      loadNewProphecy();
    </script>
  </body>
</html>
