<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" style="background: #0b0a08; font-family: 'JetBrains Mono', 'Space Mono', 'Outfit', monospace;">
  <defs>
