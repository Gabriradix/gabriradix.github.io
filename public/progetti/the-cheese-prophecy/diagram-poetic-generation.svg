    <text x="20" y="275" fill="#f5c842" font-size="9" font-weight="bold">DYNAMIC QR &amp; CARD EXPORT</text>
    <text x="20" y="295" fill="#ffffff" font-size="8.5">URL: gabriradix.it/cheese-phrophecy</text>
    <text x="20" y="312" fill="#9a8e7a" font-size="8">Format: PNG 1080x1350px 4:5 Card</text>
    <text x="20" y="328" fill="#ffe066" font-size="8">Asset: qrcode.svg (Static Vector Embed)</text>
    <text x="20" y="350" fill="#665c4d" font-size="7.5">NET-ART DIGITAL ARTIFACT</text>
  </g>

  <!-- Bottom Telemetry Footer Bar -->
