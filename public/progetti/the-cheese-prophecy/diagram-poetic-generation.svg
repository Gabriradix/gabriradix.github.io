<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" role="img" aria-labelledby="title desc">
<title id="title">The Cheese Prophecy: From words to prophecy</title><desc id="desc">Choose a prophecy. Select an aphorism at random from the existing collection. Hide it in the text. Place its words among filler. The surrounding text changes. Freeze the words. Stop the shuffle in a cascade. Locate the prophecy words. Reveal and collect. Cheese holes reveal the words. Download the card or restart.</desc>
<rect x="0" y="0" width="900" height="600" fill="#101010" stroke="#101010"/><text x="40" y="54" fill="#b5b5b5" font-size="20" font-family="Helvetica, Arial, sans-serif">The Cheese Prophecy</text><text x="40" y="108" fill="#e5e5e5" font-size="34" font-family="Helvetica, Arial, sans-serif">From words to prophecy</text><path d="M40 140L860 140" fill="none" stroke="#404040" stroke-width="2"/><path d="M40 174L405 174" fill="none" stroke="#f5c842" stroke-width="2"/><text x="40" y="210" fill="#f5c842" font-size="20" font-family="Helvetica, Arial, sans-serif">01</text><text x="40" y="252" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Choose a prophecy</text><text x="40" y="292" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Select an aphorism at random</text><text x="40" y="325.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">from the existing collection.</text><path d="M475 174L840 174" fill="none" stroke="#f5c842" stroke-width="2"/><text x="475" y="210" fill="#f5c842" font-size="20" font-family="Helvetica, Arial, sans-serif">02</text><text x="475" y="252" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Hide it in the text</text><text x="475" y="292" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Place its words among filler.</text><text x="475" y="325.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">The surrounding text changes.</text><path d="M40 349L405 349" fill="none" stroke="#f5c842" stroke-width="2"/><text x="40" y="385" fill="#f5c842" font-size="20" font-family="Helvetica, Arial, sans-serif">03</text><text x="40" y="427" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Freeze the words</text><text x="40" y="467" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Stop the shuffle in a cascade.</text><text x="40" y="500.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Locate the prophecy words.</text><path d="M475 349L840 349" fill="none" stroke="#f5c842" stroke-width="2"/><text x="475" y="385" fill="#f5c842" font-size="20" font-family="Helvetica, Arial, sans-serif">04</text><text x="475" y="427" fill="#e5e5e5" font-size="27" font-family="Helvetica, Arial, sans-serif">Reveal and collect</text><text x="475" y="467" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Cheese holes reveal the words.</text><text x="475" y="500.6" fill="#b5b5b5" font-size="24" font-family="Garamond, Georgia, serif">Download the card or restart.</text><text x="40" y="568" fill="#b5b5b5" font-size="22" font-family="Garamond, Georgia, serif">Follow the four stages in reading order.</text>
</svg>
