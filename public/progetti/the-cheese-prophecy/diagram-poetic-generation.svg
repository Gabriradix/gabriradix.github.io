    <text x="18" y="92" fill="#665c4d" font-size="8.5">{</text>
    <text x="25" y="110" fill="#9a8e7a" font-size="8.5">"origin": <tspan fill="#f5c842">"Vine 2015 / TikTok"</tspan>,</text>
    <text x="25" y="128" fill="#9a8e7a" font-size="8.5">"trend": <tspan fill="#ffe066">"Cheese of Truth"</tspan>,</text>
    <text x="25" y="146" fill="#9a8e7a" font-size="8.5">"history": <tspan fill="#fff">"Ancient Tyromancy"</tspan>,</text>
    <text x="25" y="164" fill="#9a8e7a" font-size="8.5">"lexicon": {</text>
    <text x="33" y="182" fill="#7a6e5b" font-size="8.5">"swiss_holes": <tspan fill="#f5c842">0.94</tspan>,</text>
    <text x="33" y="200" fill="#7a6e5b" font-size="8.5">"aphorisms": <tspan fill="#f5c842">60</tspan>,</text>
    <text x="33" y="218" fill="#7a6e5b" font-size="8.5">"fillers": <tspan fill="#f5c842">140</tspan></text>
    <text x="25" y="236" fill="#9a8e7a" font-size="8.5">},</text>
    <text x="25" y="254" fill="#9a8e7a" font-size="8.5">"render_mode": {</text>
    <text x="33" y="272" fill="#7a6e5b" font-size="8.5">"slap_mask": <tspan fill="#ffe066">"SVG Path Cutout"</tspan>,</text>
