    <text x="12" y="23" fill="#f5c842" font-size="11" font-weight="700">01. CHEESE OF TRUTH SEED</text>
    <text x="12" y="58" fill="#9a8e7a" font-size="8.5">MEMETIC &amp; HISTORICAL SEED</text>
    
    <!-- Code block representation -->
