      <text x="262" y="55" text-anchor="middle" fill="#f5c842" font-size="12" font-weight="bold" letter-spacing="3">✦ THE PROPHECY ✦</text>
      <text x="262" y="115" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="bold" font-style="italic">"Fire warms the hands that feed it"</text>
      <text x="262" y="148" text-anchor="middle" fill="#9a8e7a" font-size="10">ORACLE OF TRUTH • STOCHASTIC FERMENTATION</text>
      <line x1="162" y1="175" x2="362" y2="175" stroke="#f5c842" stroke-width="1"/>

      <!-- Downloadable Card Specifications Panel -->
      <g transform="translate(20, 250)">
        <rect x="0" y="0" width="485" height="185" fill="#14110b" stroke="#332a18"/>
        <text x="18" y="25" fill="#ffe066" font-size="10" font-weight="bold">📥 DOWNLOADABLE CARD SPECIFICATIONS</text>
        <line x1="18" y1="36" x2="470" y2="36" stroke="#241f14"/>

        <g transform="translate(18, 55)">
          <text x="0" y="15" fill="#ffffff" font-size="9" font-weight="bold">1. CANVAS RESOLUTION:</text>
          <text x="180" y="15" fill="#f5c842" font-size="9">1080 x 1350 px (Aspect Ratio 4:5)</text>

          <text x="0" y="38" fill="#ffffff" font-size="9" font-weight="bold">2. BACKGROUND &amp; GRAPHIC:</text>
          <text x="180" y="38" fill="#9a8e7a" font-size="9">Dark Matte + Stylized Golden Cheese Slice</text>

          <text x="0" y="61" fill="#ffffff" font-size="9" font-weight="bold">3. ATTRIBUTION LABEL:</text>
          <text x="180" y="61" fill="#ffe066" font-size="9">gabriradix.it/cheese-phrophecy</text>

          <text x="0" y="84" fill="#ffffff" font-size="9" font-weight="bold">4. QR CODE ASSET:</text>
          <text x="180" y="84" fill="#f5c842" font-size="9">qrcode.svg (Static Vector Vector File)</text>
        </g>
      </g>
    </g>
  </g>
</svg>
