<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surreal Splat Void</title>

    <!-- Font Apple Garamond / EB Garamond Fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet" />

    <!-- PlayCanvas Engine (Pinned engine with SOG v2 support) -->
    <script type="importmap">
      {
        "imports": {
          "playcanvas": "https://esm.sh/playcanvas@2.21.2"
        }
      }
    </script>

    <!-- Alpine.js -->
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
    <!-- Precompiled utilities: no CSS compiler on the visitor's device. -->
    <link rel="stylesheet" href="./experience.css" />

    <style>
      @font-face {
        font-family: "Apple Garamond Local";
        src: url("./AppleGaramond.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
      }
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Apple Garamond Local", "Apple Garamond", "EB Garamond", Garamond, serif;
        background: #000;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>

  <body x-data="pageData()" @keydown.window.escape="returnToMenu()">

    <!-- UI Overlay -->
    <template x-if="showIntro">
      <div class="absolute inset-0 flex flex-col items-center justify-center z-50 bg-cover bg-center" style="background-image: url('assets/splash.png')">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm z-0"></div>
        <div class="z-10 flex flex-col items-center relative p-6 pb-8 md:p-8 md:pb-10 bg-gradient-to-b from-[#f3f5f8] to-[#cdd5df] rounded-xl shadow-[0_20px_40px_rgba(0,0,0,0.5),inset_0_1px_1px_rgba(255,255,255,1)] border border-[#8391a1] space-y-4 md:space-y-6 max-w-[90%] md:max-w-xl w-full">
          <!-- Mac Window Controls -->
          <div class="absolute top-3 left-3 flex space-x-2">
            <div class="w-[10px] h-[10px] md:w-[14px] md:h-[14px] rounded-full bg-gradient-to-b from-[#ff8782] to-[#de2b2a] border border-[#ce1a17] shadow-inner"></div>
            <div class="w-[10px] h-[10px] md:w-[14px] md:h-[14px] rounded-full bg-gradient-to-b from-[#ffdd56] to-[#df9b0f] border border-[#ce8a05] shadow-inner"></div>
            <div class="w-[10px] h-[10px] md:w-[14px] md:h-[14px] rounded-full bg-gradient-to-b from-[#5ce356] to-[#20ae1e] border border-[#169d14] shadow-inner"></div>
          </div>
          <h1 class="text-3xl md:text-5xl mt-4 md:mt-6 font-bold text-[#111] tracking-tight text-center" style="text-shadow: 0 1px 0 rgba(255, 255, 255, 0.9)">
            Surreal Splat Void
          </h1>
          <button @click="startExperience" :disabled="isLoading" :class="isLoading ? 'opacity-50 cursor-wait' : 'active:translate-y-[1px]'" class="relative group mt-4 md:mt-6 px-8 md:px-12 py-2 overflow-hidden rounded-[20px] font-bold text-white text-lg md:text-xl border border-[#0d3368] shadow-[0_3px_5px_rgba(0,0,0,0.4)] transition-opacity duration-300">
            <div class="absolute inset-0 bg-gradient-to-b from-[#6cb0fc] via-[#2f83ee] to-[#044c9b]"></div>
            <div class="absolute top-[2px] left-[4%] right-[4%] h-[40%] bg-gradient-to-b from-white to-white/10 rounded-full pointer-events-none"></div>
            <span class="relative z-10" style="text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.6)" x-text="isLoading ? loadingText : 'Inizia Esperienza'"></span>
          </button>
          <p x-show="loadError" x-text="loadError" role="alert" class="text-center text-[#111]"></p>
        </div>
      </div>
    </template>

    <canvas id="application-canvas"></canvas>
    <audio id="sound" preload="none" loop src="./assets/Petiatil%20Cx%20Htdui.mp3"></audio>

    <script>
      function pageData() {
        return {
          showIntro: true,
          isLoading: true,
          loadingText: 'Caricamento…',
          loadError: '',
          init() {
            window.isExperienceStarted = false;
            const applyStatus = (status) => {
              this.isLoading = !status.ready;
              this.loadError = status.error || '';
              this.loadingText = status.error ? 'Caricamento non riuscito' : 'Caricamento ' + (status.loaded || 0) + '/5…';
            };
            window.addEventListener('splat-status', event => applyStatus(event.detail));
            window.addEventListener('splat-return-to-menu', () => this.returnToMenu());
            if (window.splatStatus) applyStatus(window.splatStatus);
          },
          startExperience() {
            if (this.isLoading) return;
            this.showIntro = false;
            window.isExperienceStarted = true;
            const entity = document.getElementById("sound");
            if (entity) entity.play().catch(() => {});
            window.dispatchEvent(new Event("splat-experience"));
            window.parent.postMessage('force-compact-header', '*');

            // Lock pointer for camera control
            const canvas = document.getElementById('application-canvas');
            if (canvas) {
                try { canvas.requestPointerLock()?.catch(() => {}); } catch(e) {}
            }
          },
          returnToMenu() {
            this.showIntro = true;
            window.isExperienceStarted = false;
            const entity = document.getElementById("sound");
            if (entity) entity.pause();
            window.dispatchEvent(new Event("splat-experience"));
            window.parent.postMessage('reset-compact-header', '*');
            document.exitPointerLock();
          },
        };
      }
    </script>

    <script type="module">
      import('./scene.js').catch(error => {
        console.error(error);
        window.splatStatus = { ready: false, error: 'Motore 3D non disponibile. Ricarica la pagina per riprovare.' };
        window.dispatchEvent(new CustomEvent('splat-status', { detail: window.splatStatus }));
      });
    </script>
  </body>
</html>
